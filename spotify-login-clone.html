<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spotify</title>
    <link rel="stylesheet" href="spotify.css">
</head>

<body>
    <div class="container">




        <div class="continuar">
            <img class="logo" width="30px" src="spotify.webp" alt="Logo">
            <h1 style="color: white;">Entrar no Spotify</h1>
            <button class="btng" type="submit">
                <img src="google.webp" alt="Logo" width="20">
                Continuar Com O Google
            </button>

            <button class="btnf" type="submit">
                <img src="facebook.webp" alt="Logo" width="20">
                Continuar Com O Facebook
            </button>

            <button class="btnap" type="submit">
                <img src="apple.webp" alt="Logo" width="20">
                Continuar Com A Apple
            </button>

            <button class="btn" type="submit">
                Continuar Com Um Numero De Telefone
            </button>
            <form action="/login">
                <div class="login">
                    <label for="usuario" style="color: white;">E-mail ou nome de usuario</label>
                    <input class="usuario" type="text" id="usuario" placeholder="E-mail ou nome de usuário">
                    <label class="senhal" for="usuario" style="color: white;">Senha</label>
                    <input class="senha" type="password" id="senha" placeholder="Digite a senha">
            </form>
            <label class="switch" style="color: white;">
                <input class="box" type="checkbox">Lembrar-me
            </label>
        </div>
        <button class="btnentrar" type="submit">Entrar</button>
        <div class="opcoes">
            <a style="color: white;" class="esqueceusenha" href="esqueceuasenha">Esqueceu a senha?</a>
            <label style="color: grey;" for="">Não tem uma conta?
                <a style="color: white;" class="inscrever" href="inscrever">Inscrever-se no Spotify</a>
            </label>


        </div>

    </div>

    </div>












</body>

</html>
